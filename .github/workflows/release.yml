name: Release

# Official release builds. Run manually (Actions tab or scripts/ci.sh release)
# for an already-pushed tag like v0.4.0 (stable) or v0.4.0-beta / v0.4.0-beta.2
# (beta); pushing the tag alone builds nothing. It builds all
# three platforms, verifies and packages them, and creates a DRAFT GitHub
# Release with the files attached. Review the draft, then publish it and upload
# the same files to itch.io etc. Nightly/CI builds stay in build.yml.
#
# The git tag names the GitHub Release; the files inside are named by the build
# identifier the app shows (v<version>-<channel>-<hash>), the same scheme as
# build.yml, so texturelab.io can check a download belongs to the release.
#
# Optional signing: each platform signs only when its secrets exist, otherwise
# it ships unsigned (Gatekeeper / SmartScreen warnings).
#   macOS:   APPLE_CERT_P12 (base64 Developer ID Application .p12),
#            APPLE_CERT_PASSWORD, and for notarization APPLE_ID, APPLE_TEAM_ID,
#            APPLE_APP_PASSWORD (app-specific password)
#   Windows: Azure Artifact Signing (formerly Trusted Signing) — AZURE_TENANT_ID, AZURE_CLIENT_ID,
#            AZURE_CLIENT_SECRET, AZURE_SIGNING_ENDPOINT,
#            AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.4.0 or v0.4.0-beta"
        required: true

permissions:
  contents: read

# Never run two releases of the same tag at once.
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  QT_VERSION: "6.7.3"
  TAG: ${{ inputs.tag }}

jobs:
  # Refuses to build unless the tag, the CMake version and the release config
  # all agree, so a mistagged or misconfigured build never gets packaged.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      build_id: ${{ steps.v.outputs.build_id }}
      identifier: ${{ steps.v.outputs.identifier }}
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
      build: ${{ steps.v.outputs.build }}
      commit: ${{ steps.v.outputs.commit }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          # scripts/build-id.sh counts commits for the build number, so it
          # needs full history.
          fetch-depth: 0

      - name: Check tag matches the app version
        id: v
        run: |
          # Same rules as GetGitHash.cmake and build.yml, via one script.
          NUM=$(scripts/build-id.sh --field version)
          CHANNEL=$(scripts/build-id.sh --field channel)
          # The tag has to say the same channel the build will report: v<num>
          # for stable, v<num>-beta or v<num>-beta.<n> for beta. A stable tag
          # on a beta-configured tree (or the reverse) would put a build on the
          # wrong update channel.
          case "$CHANNEL" in
            stable) PATTERN="^v${NUM//./\\.}$" ;;
            beta)   PATTERN="^v${NUM//./\\.}-beta(\.[0-9]+)?$" ;;
            *) echo "::error::TEXTURELAB_CHANNEL is '$CHANNEL', expected stable or beta"; exit 1 ;;
          esac
          if ! echo "$TAG" | grep -qE "$PATTERN"; then
            echo "::error::Tag '$TAG' does not match version ${NUM} on the ${CHANNEL} channel (project() VERSION + TEXTURELAB_CHANNEL in src/texturelab/CMakeLists.txt)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build_id=$(scripts/build-id.sh --field tag)" >> "$GITHUB_OUTPUT"
          for field in identifier version channel build commit; do
            echo "$field=$(scripts/build-id.sh --field "$field")" >> "$GITHUB_OUTPUT"
          done
          {
            echo "### Build identity — $TAG"
            echo ""
            echo "| | |"
            echo "|---|---|"
            for field in identifier version channel build commit; do
              echo "| $field | \`$(scripts/build-id.sh --field "$field")\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CHANNEL" = "stable" ]; then echo "prerelease=false"; else echo "prerelease=true"; fi >> "$GITHUB_OUTPUT"

      - name: Check update checker points at production
        run: |
          if ! grep -qE '^constexpr const char\* kApiBase = "https://texturelab.io";' src/texturelab/update/updatechecker.cpp; then
            echo "::error::kApiBase in src/texturelab/update/updatechecker.cpp is not https://texturelab.io"
            exit 1
          fi

      - name: Check release secrets are set
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          # A release without crash reporting or uploaded symbols is worse than
          # no release, so these are required (unlike in nightly builds).
          [ -n "$SENTRY_DSN" ] || { echo "::error::SENTRY_DSN secret is not set"; exit 1; }
          [ -n "$SENTRY_AUTH_TOKEN" ] || { echo "::error::SENTRY_AUTH_TOKEN secret is not set"; exit 1; }

      - name: Check theme hygiene
        run: bash scripts/check-theme-hygiene.sh

  build-linux:
    needs: preflight
    # Oldest supported runner: the AppImage only runs on distros with a glibc at
    # least as new as the one it was built against.
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      BUILD_ID: ${{ needs.preflight.outputs.build_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          submodules: recursive
          fetch-depth: 0

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: "qtshadertools"
          dir: "${{ github.workspace }}/Qt"
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgl1-mesa-dev \
            libxkbcommon-dev libvulkan-dev libxcb-cursor0 libxcb-shape0-dev \
            libcurl4-openssl-dev xvfb

      - name: Configure
        run: cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSENTRY_BACKEND=crashpad -DTEXTURELAB_SENTRY_DSN="${{ secrets.SENTRY_DSN }}" -DTEXTURELAB_SENTRY_ENVIRONMENT=production

      - name: Build
        run: cmake --build build --target texturelab --parallel $(nproc)

      - name: Upload debug symbols to Sentry and strip
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          set -e
          curl -sL https://sentry.io/get-cli/ | bash
          # Upload the full unstripped binary (debug info + .eh_frame CFI); see build.yml.
          sentry-cli debug-files upload --include-sources build/src/texturelab/texturelab
          # Keep an unstripped copy for offline symbolication.
          mkdir -p symbols && cp build/src/texturelab/texturelab symbols/
          # The GNU build-id survives stripping, so the uploaded symbols still match.
          strip build/src/texturelab/texturelab

      - name: Install LinuxDeploy
        uses: miurahr/install-linuxdeploy-action@v1
        with:
          plugins: qt appimage

      - name: Create AppImage
        env:
          QTDIR: ${{ github.workspace }}/Qt/Qt/${{ env.QT_VERSION }}/gcc_64
        run: scripts/package-linux.sh "$BUILD_ID"

      - name: Smoke test AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          OUT=$(xvfb-run -a "dist/texturelab-linux-${BUILD_ID}-x86_64.AppImage" --version)
          echo "$OUT"
          echo "$OUT" | grep -q "texturelab ${BUILD_ID#v}" || { echo "::error::unexpected --version output"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: symbols-linux-${{ env.TAG }}
          path: symbols/
          retention-days: 90

  build-windows:
    needs: preflight
    runs-on: windows-2022
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      BUILD_ID: ${{ needs.preflight.outputs.build_id }}
      HAS_WIN_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          submodules: recursive
          fetch-depth: 0

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: "win64_msvc2019_64"
          modules: "qtshadertools"
          dir: "${{ github.workspace }}/Qt"
          cache: true

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DSENTRY_BACKEND=crashpad -DTEXTURELAB_SENTRY_DSN="${{ secrets.SENTRY_DSN }}" -DTEXTURELAB_SENTRY_ENVIRONMENT=production

      - name: Build
        run: cmake --build build --target texturelab --config Release --parallel

      - name: Upload debug symbols to Sentry
        shell: pwsh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/getsentry/sentry-cli/releases/latest/download/sentry-cli-Windows-x86_64.exe" -OutFile "sentry-cli.exe"
          $out = "build\src\texturelab\Release"
          if (-not (Test-Path "$out\texturelab.pdb")) { Write-Error "texturelab.pdb not found; Sentry cannot symbolicate." }
          .\sentry-cli.exe debug-files check "$out\texturelab.exe"
          .\sentry-cli.exe debug-files upload --include-sources "$out\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force symbols | Out-Null
          Copy-Item "$out\texturelab.exe", "$out\texturelab.pdb" symbols\

      - name: Deploy Qt dependencies
        shell: pwsh
        env:
          QTDIR: ${{ github.workspace }}\Qt\Qt\${{ env.QT_VERSION }}\msvc2019_64
        run: scripts/package-windows.ps1 -Tag $env:BUILD_ID -Stage Deploy

      # Authenticode signing doesn't touch the CodeView record, so the Debug IDs
      # uploaded to Sentry above still match the signed binaries.
      - name: Sign executables
        if: env.HAS_WIN_SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\dist\texturelab-win-${{ env.BUILD_ID }}\texturelab.exe
            ${{ github.workspace }}\dist\texturelab-win-${{ env.BUILD_ID }}\crashpad_handler.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Smoke test
        shell: pwsh
        run: |
          # GUI-subsystem exe: redirect stdout to a file to read the --version line.
          $p = Start-Process "dist\texturelab-win-$env:BUILD_ID\texturelab.exe" -ArgumentList "--version" `
                 -RedirectStandardOutput version.txt -PassThru -Wait
          Get-Content version.txt
          if ($p.ExitCode -ne 0) { Write-Error "texturelab.exe --version exited with $($p.ExitCode)" }

      - name: Zip
        shell: pwsh
        run: scripts/package-windows.ps1 -Tag $env:BUILD_ID -Stage Zip

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: symbols-windows-${{ env.TAG }}
          path: symbols/
          retention-days: 90

  build-macos:
    needs: preflight
    # Xcode 15 on macos-14: Qt 6.7 still needs AGL.framework, gone from newer SDKs.
    runs-on: macos-14
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      BUILD_ID: ${{ needs.preflight.outputs.build_id }}
      HAS_MAC_SIGNING: ${{ secrets.APPLE_CERT_P12 != '' }}
      HAS_MAC_NOTARIZE: ${{ secrets.APPLE_CERT_P12 != '' && secrets.APPLE_ID != '' }}
      APP: build/src/texturelab/texturelab.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode 15
        run: |
          XC=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] || { echo "No Xcode 15.x on runner"; ls -d /Applications/Xcode_*.app; exit 1; }
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: "qtshadertools"
          dir: "${{ github.workspace }}/Qt"
          cache: true

      - name: Configure
        run: |
          # Crashpad needs CMAKE_OSX_SYSROOT set to find the Mach .defs; see build.yml.
          cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_SYSROOT="$(xcrun --show-sdk-path)" \
            -DTEXTURELAB_SENTRY_DSN="${{ secrets.SENTRY_DSN }}" -DTEXTURELAB_SENTRY_ENVIRONMENT=production

      - name: Build
        run: cmake --build build --target texturelab --parallel $(sysctl -n hw.ncpu)

      - name: Generate dSYM, upload to Sentry, strip
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          set -e
          mkdir -p symbols
          dsymutil "$APP/Contents/MacOS/texturelab" -o symbols/texturelab.dSYM
          strip "$APP/Contents/MacOS/texturelab"
          curl -sL https://sentry.io/get-cli/ | bash
          sentry-cli debug-files upload --include-sources symbols/texturelab.dSYM

      - name: Import signing certificate
        if: env.HAS_MAC_SIGNING == 'true'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW=$(uuidgen)
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KC" | grep -o '"Developer ID Application:[^"]*"' | head -1 | tr -d '"')
          [ -n "$ID" ] || { echo "::error::No 'Developer ID Application' identity in APPLE_CERT_P12"; exit 1; }
          echo "MAC_SIGN_ID=$ID" >> "$GITHUB_ENV"

      - name: Bundle Qt, sign and create DMG
        env:
          QTDIR: ${{ github.workspace }}/Qt/Qt/${{ env.QT_VERSION }}/macos
        run: scripts/package-macos.sh "$BUILD_ID"

      - name: Smoke test
        run: |
          OUT=$("$APP/Contents/MacOS/texturelab" --version)
          echo "$OUT"
          echo "$OUT" | grep -q "texturelab ${BUILD_ID#v}" || { echo "::error::unexpected --version output"; exit 1; }

      - name: Notarize and staple
        if: env.HAS_MAC_NOTARIZE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG="dist/texturelab-mac-${BUILD_ID}-universal.dmg"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --timeout 30m
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: symbols-macos-${{ env.TAG }}
          path: symbols/
          retention-days: 90

  # Runs only when all three platforms succeeded: no partial releases.
  draft-release:
    needs: [preflight, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      url: ${{ steps.draft.outputs.url }}
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update draft release
        id: draft
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run: refresh the assets on the existing release, keep its notes.
            # Only while it's still a draft — replacing assets people may already
            # have downloaded (and whose checksums were published) is not allowed.
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" != "true" ]; then
              echo "::error::Release $TAG is already published; refusing to replace its assets. Bump the version instead."
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber
          else
            FLAGS=(--draft --verify-tag --generate-notes --title "TextureLab ${TAG}")
            [ "$PRERELEASE" = "true" ] && FLAGS+=(--prerelease)
            gh release create "$TAG" dist/* "${FLAGS[@]}"
          fi
          gh release view "$TAG" --json url,isDraft,assets --jq '{url, isDraft, assets: [.assets[].name]}'
          echo "url=$(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_OUTPUT"

  # Creates the matching DRAFT release on texturelab.io, prefilled: identity,
  # title, the GitHub-generated notes, and download links. The links are the
  # GitHub Release asset URLs — permanent and tied to the tag, unlike Actions
  # artifacts (which expire) — so they answer once the GitHub draft is
  # published. The site endpoint only ever creates or updates drafts; going
  # live is still a human click in its ops UI. Re-running updates the same
  # draft (matched by identifier) instead of adding another.
  #
  # Needs the repository secret TEXTURELAB_SITE_TOKEN (an API token from the
  # site's ops dashboard, ability releases:draft). Optional repository variable
  # TEXTURELAB_SITE_URL points it elsewhere (default https://texturelab.io).
  site-draft:
    needs: [preflight, draft-release]
    runs-on: ubuntu-latest
    outputs:
      edit_url: ${{ steps.post.outputs.edit_url }}
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      BUILD_ID: ${{ needs.preflight.outputs.build_id }}
      IDENTIFIER: ${{ needs.preflight.outputs.identifier }}
      BUILD: ${{ needs.preflight.outputs.build }}
      SITE_TOKEN: ${{ secrets.TEXTURELAB_SITE_TOKEN }}
      SITE_URL: ${{ vars.TEXTURELAB_SITE_URL || 'https://texturelab.io' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ASSET_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download
    steps:
      - name: Create draft on texturelab.io
        id: post
        run: |
          if [ -z "$SITE_TOKEN" ]; then
            echo "::error::TEXTURELAB_SITE_TOKEN secret is not set; create a token in the site's ops dashboard (API tokens) and add it as a repository secret."
            exit 1
          fi

          # File names as the package scripts write them; checked against the
          # GitHub draft so the site never gets a link to a file that isn't there.
          WINDOWS="texturelab-win-${BUILD_ID}-x64.zip"
          MAC="texturelab-mac-${BUILD_ID}-universal.dmg"
          LINUX="texturelab-linux-${BUILD_ID}-x86_64.AppImage"
          RELEASE=$(gh release view "$TAG" --json name,body,assets)
          for f in "$WINDOWS" "$MAC" "$LINUX"; do
            jq -e --arg f "$f" '.assets | map(.name) | index($f)' <<<"$RELEASE" >/dev/null || {
              echo "::error::$f is not attached to the GitHub release $TAG"
              exit 1
            }
          done

          PAYLOAD=$(jq -n \
            --arg identifier "$IDENTIFIER" --argjson build "$BUILD" \
            --arg title "$(jq -r .name <<<"$RELEASE")" \
            --arg notes "$(jq -r '.body // ""' <<<"$RELEASE")" \
            --arg windows "$ASSET_BASE/$TAG/$WINDOWS" \
            --arg mac "$ASSET_BASE/$TAG/$MAC" \
            --arg linux "$ASSET_BASE/$TAG/$LINUX" \
            '{identifier: $identifier, build: $build, title: $title,
              notes: (if $notes == "" then null else $notes end),
              downloads: {windows: $windows, mac: $mac, linux: $linux, itch: null}}')

          # The token goes in a header read from a file, not on the command
          # line, so it never shows in the process list.
          printf 'Authorization: Bearer %s\n' "$SITE_TOKEN" > "$RUNNER_TEMP/auth-header"
          STATUS=$(curl -sS -o response.json -w '%{http_code}' --max-time 30 \
            -X POST "${SITE_URL%/}/api/ops/releases/drafts" \
            -H @"$RUNNER_TEMP/auth-header" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            --data-binary "$PAYLOAD")
          rm -f "$RUNNER_TEMP/auth-header"

          case "$STATUS" in
            200|201)
              EDIT_URL=$(jq -r .data.editUrl response.json)
              CREATED=$(jq -r .data.created response.json)
              echo "edit_url=$EDIT_URL" >> "$GITHUB_OUTPUT"
              VERB=$([ "$CREATED" = "true" ] && echo "Created" || echo "Updated")
              echo "$VERB draft $IDENTIFIER on $SITE_URL: $EDIT_URL"
              echo "### texturelab.io draft: [$IDENTIFIER]($EDIT_URL) ($VERB)" >> "$GITHUB_STEP_SUMMARY"
              ;;
            409)
              echo "::error::$IDENTIFIER is already published on $SITE_URL; the API never changes a published release. $(jq -r '.error // empty' response.json)"
              exit 1
              ;;
            *)
              echo "::error::$SITE_URL answered HTTP $STATUS"
              cat response.json
              exit 1
              ;;
          esac

  # Same post as build.yml's, for a release: the build identity, the download
  # URLs (which only answer once the GitHub draft is published), and links to
  # both drafts. Runs on failure too, so a broken release doesn't go unnoticed.
  announce:
    needs: [preflight, build-linux, build-windows, build-macos, draft-release, site-draft]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      BUILD_ID: ${{ needs.preflight.outputs.build_id }}
      IDENTIFIER: ${{ needs.preflight.outputs.identifier }}
      VERSION: ${{ needs.preflight.outputs.version }}
      CHANNEL: ${{ needs.preflight.outputs.channel }}
      BUILD: ${{ needs.preflight.outputs.build }}
      COMMIT: ${{ needs.preflight.outputs.commit }}
      DRAFT_URL: ${{ needs.draft-release.outputs.url }}
      DRAFT_RESULT: ${{ needs.draft-release.result }}
      SITE_EDIT_URL: ${{ needs.site-draft.outputs.edit_url }}
      SITE_RESULT: ${{ needs.site-draft.result }}
      LINUX_RESULT: ${{ needs.build-linux.result }}
      WINDOWS_RESULT: ${{ needs.build-windows.result }}
      MACOS_RESULT: ${{ needs.build-macos.result }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ASSET_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download
    steps:
      - name: Post to Discord
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK is not set; skipping."
            exit 0
          fi

          status_emoji() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              cancelled) echo "⏹️" ;;
              *) echo "⚠️" ;;
            esac
          }

          # File names as the package scripts write them.
          download_line() {
            local result="$1" label="$2" file="$3"
            if [[ "$result" == "success" && "$DRAFT_RESULT" == "success" ]]; then
              echo "$(status_emoji "$result") **$label** — $ASSET_BASE/$TAG/$file"
            elif [[ "$result" == "success" ]]; then
              echo "$(status_emoji "$result") **$label** — built, not released"
            else
              echo "$(status_emoji "$result") **$label** — build $result"
            fi
          }

          if [[ "$DRAFT_RESULT" == "success" && "$SITE_RESULT" == "success" ]]; then
            TITLE="Release drafts ready — $TAG ($CHANNEL)"
            COLOR=3066993
            NEXT="1. [Publish the GitHub draft]($DRAFT_URL) — the download links start working.
          2. [Publish on texturelab.io]($SITE_EDIT_URL) — builds on the $CHANNEL channel are offered it."
          elif [[ "$DRAFT_RESULT" == "success" ]]; then
            TITLE="Release draft ready, site draft failed — $TAG ($CHANNEL)"
            COLOR=15105570
            NEXT="[GitHub draft]($DRAFT_URL) is ready, but creating the texturelab.io draft failed ($SITE_RESULT); see the run. Re-running the release updates it."
          else
            TITLE="Release failed — $TAG ($CHANNEL)"
            COLOR=15158332
            NEXT="No draft was created."
          fi

          DESCRIPTION="$(download_line "$LINUX_RESULT" "Linux" "texturelab-linux-${BUILD_ID}-x86_64.AppImage")
          $(download_line "$WINDOWS_RESULT" "Windows" "texturelab-win-${BUILD_ID}-x64.zip")
          $(download_line "$MACOS_RESULT" "macOS" "texturelab-mac-${BUILD_ID}-universal.dmg")

          $NEXT

          [View run]($RUN_URL)"
          DESCRIPTION=$(sed 's/^ *//' <<<"$DESCRIPTION")

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" --arg description "$DESCRIPTION" \
            --arg url "${DRAFT_URL:-$RUN_URL}" --argjson color "$COLOR" \
            --arg identifier "$IDENTIFIER" --arg build "$BUILD" \
            --arg channel "$CHANNEL" --arg version "$VERSION" --arg commit "$COMMIT" \
            '{embeds: [{
              title: $title, description: $description, color: $color, url: $url,
              fields: [
                {name: "Identifier", value: "`\($identifier)`", inline: false},
                {name: "Build",      value: "`\($build)`",      inline: true},
                {name: "Channel",    value: "`\($channel)`",    inline: true},
                {name: "Version",    value: "`\($version)`",    inline: true},
                {name: "Commit",     value: "`\($commit)`",     inline: true}
              ]
            }]}')

          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
