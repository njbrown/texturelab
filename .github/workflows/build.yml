name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.0"
          modules: "qtshadertools"
          dir: "${{ github.workspace }}/Qt"
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libvulkan-dev \
            libxcb-cursor0 \
            libxcb-shape0-dev

      - name: Configure CMake
        run: cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target texturelab --parallel $(nproc)

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: texturelab-linux
          path: build/src/texturelab/texturelab

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.0"
          arch: "win64_msvc2019_64"
          modules: "qtshadertools"
          dir: "${{ github.workspace }}/Qt"
          cache: true

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target texturelab --config Release --parallel

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: texturelab-windows
          path: build/src/texturelab/Release/texturelab.exe

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.0"
          modules: "qtshadertools"
          dir: "${{ github.workspace }}/Qt"
          cache: true

      - name: Configure CMake
        run: cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target texturelab --parallel $(sysctl -n hw.ncpu)

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: texturelab-macos
          path: build/src/texturelab/texturelab.app
