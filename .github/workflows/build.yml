name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.0"
          modules: "qtshadertools"
          dir: "${{ github.workspace }}/Qt"
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libvulkan-dev \
            libxcb-cursor0 \
            libxcb-shape0-dev

      - name: Configure CMake
        run: cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target texturelab --parallel $(nproc)

      - name: Install LinuxDeploy
        uses: miurahr/install-linuxdeploy-action@v1
        with:
          plugins: qt appimage

      - name: Create AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          export QMAKE=${{ github.workspace }}/Qt/Qt/6.7.0/gcc_64/bin/qmake
          export PATH=${{ github.workspace }}/Qt/Qt/6.7.0/gcc_64/bin:$PATH
          export LD_LIBRARY_PATH=${{ github.workspace }}/Qt/Qt/6.7.0/gcc_64/lib:$LD_LIBRARY_PATH

          # Create desktop file
          mkdir -p AppDir/usr/share/applications
          cat > AppDir/usr/share/applications/texturelab.desktop << EOF
          [Desktop Entry]
          Type=Application
          Name=TextureLab
          Exec=texturelab
          Icon=texturelab
          Categories=Graphics;
          EOF

          # Create icon (use placeholder if not found)
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          if [ -f public/assets/icons/icon.png ]; then
            cp public/assets/icons/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/texturelab.png
          else
            # Create a simple placeholder icon
            convert -size 256x256 xc:gray AppDir/usr/share/icons/hicolor/256x256/apps/texturelab.png 2>/dev/null || true
          fi

          linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable build/src/texturelab/texturelab \
            --desktop-file AppDir/usr/share/applications/texturelab.desktop \
            --plugin qt \
            --output appimage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: texturelab-linux
          path: "*.AppImage"

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.0"
          arch: "win64_msvc2019_64"
          modules: "qtshadertools"
          dir: "${{ github.workspace }}/Qt"
          cache: true

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target texturelab --config Release --parallel

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: texturelab-windows
          path: build/src/texturelab/Release/texturelab.exe

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.0"
          modules: "qtshadertools"
          dir: "${{ github.workspace }}/Qt"
          cache: true

      - name: Configure CMake
        run: cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target texturelab --parallel $(sysctl -n hw.ncpu)

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: texturelab-macos
          path: build/src/texturelab/texturelab.app
