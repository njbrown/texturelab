name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-linux:
    # runs-on: ubuntu-20.04
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.0"
          modules: "qtshadertools"
          dir: "${{ github.workspace }}/Qt"
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libvulkan-dev \
            libxcb-cursor0 \
            libxcb-shape0-dev

      - name: Configure CMake
        run: cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target texturelab --parallel $(nproc)

      - name: Install LinuxDeploy
        uses: miurahr/install-linuxdeploy-action@v1
        with:
          plugins: qt appimage

      - name: Create AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          DEPLOY_STDCXX: 1
        run: |
          export QMAKE=${{ github.workspace }}/Qt/Qt/6.7.0/gcc_64/bin/qmake
          export PATH=${{ github.workspace }}/Qt/Qt/6.7.0/gcc_64/bin:$PATH
          export LD_LIBRARY_PATH=${{ github.workspace }}/Qt/Qt/6.7.0/gcc_64/lib:$LD_LIBRARY_PATH

          # Create desktop file
          cat > texturelab.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=TextureLab
          Exec=texturelab
          Icon=texturelab
          Categories=Graphics;
          EOF

          # Create a placeholder icon (256x256 PNG with "TL" text)
          cp src/icons/logo.png texturelab.png

          linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable build/src/texturelab/texturelab \
            --desktop-file texturelab.desktop \
            --icon-file texturelab.png \
            --plugin qt \
            --output appimage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: texturelab-linux
          path: "*.AppImage"

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.0"
          arch: "win64_msvc2019_64"
          modules: "qtshadertools"
          dir: "${{ github.workspace }}/Qt"
          cache: true

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target texturelab --config Release --parallel

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: texturelab-windows
          path: build/src/texturelab/Release/texturelab.exe

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.0"
          modules: "qtshadertools"
          dir: "${{ github.workspace }}/Qt"
          cache: true

      - name: Configure CMake
        run: cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target texturelab --parallel $(sysctl -n hw.ncpu)

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: texturelab-macos
          path: build/src/texturelab/texturelab.app
